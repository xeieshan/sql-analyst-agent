[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-analyst-agent"
version = "0.1.0"
description = "A tool-using LLM agent that answers business questions over SQLite, with an execution-accuracy eval harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["litellm>=1.40", "sqlglot>=25"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sql-agent = "sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
